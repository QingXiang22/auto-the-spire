<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1428" role="img" aria-labelledby="title-turn-start desc-turn-start" style="font-family:Inter,Segoe UI,Microsoft YaHei,system-ui,sans-serif"><title id="title-turn-start">先对齐时点，再复用效果模板</title><desc id="desc-turn-start">从批量创建走到玩家可操作阶段。标记“差异”的步骤是当前实现边界；箭头旁的编号仅用于阅读，不是游戏内回合号。</desc><defs><marker id="arrow-turn-start" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#94a3b8" stroke-width="1.4" /></marker></defs><rect width="1440" height="1428" rx="22" fill="#ffffff" /><rect x="24" y="88" width="662" height="1248" rx="18" fill="#f6f9ff" /><rect x="754" y="88" width="662" height="1248" rx="18" fill="#f1fbf7" /><text x="48" y="40" font-size="16" font-weight="700" fill="#1d4ed8"><tspan x="48" dy="0">STS2-SIM</tspan></text><text x="48" y="67" font-size="22" font-weight="650" fill="#172c46"><tspan x="48" dy="0">C#领域引擎 · 锁定参考</tspan></text><text x="778" y="40" font-size="16" font-weight="700" fill="#087f68"><tspan x="778" dy="0">BASE-SPIRE</tspan></text><text x="778" y="67" font-size="22" font-weight="650" fill="#172c46"><tspan x="778" dy="0">DSL领域规则 · 当前实现</tspan></text><circle cx="720" cy="158" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="163" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">1</tspan></text><g class="node" data-key="turn-start-source-0" data-diff="false" tabindex="0" role="button" aria-label="批量创建 → 槽位排序，查看说明和源码"><title>批量创建 → 槽位排序: 按工厂顺序抽HP和分配CombatId；排序改变行动列表，不改出生历史。</title><rect x="48" y="110" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="125" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="139" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">批量创建 → 槽位排序</tspan></text><text x="70" y="168" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">按工厂顺序抽HP和分配CombatId；排序改变行动列表，不改出生历史。</tspan></text></g><g class="node" data-key="turn-start-current-0" data-diff="false" tabindex="0" role="button" aria-label="批量创建 → 槽位排序，查看说明和源码"><title>批量创建 → 槽位排序: 按工厂顺序抽HP并保存出生编号、CombatId和个体种子；按槽位整理行动与监听顺序。</title><rect x="778" y="110" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="125" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="139" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">批量创建 → 槽位排序</tspan></text><text x="800" y="168" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">按工厂顺序抽HP并保存出生编号、CombatId和个体种子；按槽位整理行</tspan><tspan x="800" dy="25.16">动与监听顺序。</tspan></text></g><path d="M355,252 V275" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-start)" /><path d="M1085,252 V275" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-start)" /><circle cx="720" cy="328" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="333" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">2</tspan></text><g class="node" data-key="turn-start-source-1" data-diff="false" tabindex="0" role="button" aria-label="先设置图，再处理入场，查看说明和源码"><title>先设置图，再处理入场: 重置战斗牌区 → 全体SetUpForCombat → 房间hook → AfterAddedToRoom → BeforeCombatStart。</title><rect x="48" y="280" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="295" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="309" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">先设置图，再处理入场</tspan></text><text x="70" y="338" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">重置战斗牌区 → 全体SetUpForCombat → 房间hook → </tspan><tspan x="70" dy="25.16">AfterAddedToRoom → BeforeCombatStart。</tspan></text></g><g class="node" data-key="turn-start-current-1" data-diff="false" tabindex="0" role="button" aria-label="建图 → 房间进入 → 敌人入场，查看说明和源码"><title>建图 → 房间进入 → 敌人入场: 全部敌人先建空图，再发房间进入通知、EnemyAddedToCombat和BeforeCombatStart。生成不建图、不选招。</title><rect x="778" y="280" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="295" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="309" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">建图 → 房间进入 → 敌人入场</tspan></text><text x="800" y="338" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">全部敌人先建空图，再发房间进入通知、EnemyAddedToCombat和</tspan><tspan x="800" dy="25.16">BeforeCombatStart。生成不建图、不选招。</tspan></text></g><path d="M355,422 V445" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-start)" /><path d="M1085,422 V445" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-start)" /><circle cx="720" cy="498" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="503" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">3</tspan></text><g class="node" data-key="turn-start-source-2" data-diff="false" tabindex="0" role="button" aria-label="Creature.BeforeTurnStart，查看说明和源码"><title>Creature.BeforeTurnStart: 保存Power回合开始量；随后BeforeSideTurnStart，参与者由当前阵营决定。</title><rect x="48" y="450" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="465" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="479" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">Creature.BeforeTurnStart</tspan></text><text x="70" y="508" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">保存Power回合开始量；随后BeforeSideTurnStart，参与者由当前阵营</tspan><tspan x="70" dy="25.16">决定。</tspan></text></g><g class="node" data-key="turn-start-current-2" data-diff="false" tabindex="0" role="button" aria-label="BeforePlayerSideTurnStart，查看说明和源码"><title>BeforePlayerSideTurnStart: 先重置回合事实，再发玩家侧开始前通知；清格挡与重置能量仍看到旧TurnNumber。</title><rect x="778" y="450" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="465" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="479" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">BeforePlayerSideTurnStart</tspan></text><text x="800" y="508" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">先重置回合事实，再发玩家侧开始前通知；清格挡与重置能量仍看到旧Tu</tspan><tspan x="800" dy="25.16">rnNumber。</tspan></text></g><path d="M355,592 V615" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-start)" /><path d="M1085,592 V615" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-start)" /><circle cx="720" cy="668" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="673" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">4</tspan></text><g class="node" data-key="turn-start-source-3" data-diff="false" tabindex="0" role="button" aria-label="普通玩家回合在此RollMove，查看说明和源码"><title>普通玩家回合在此RollMove: 位于BeforeSideTurnStart之后、清格挡之前；额外回合不重滚。</title><rect x="48" y="620" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="635" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="649" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">普通玩家回合在此RollMove</tspan></text><text x="70" y="678" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">位于BeforeSideTurnStart之后、清格挡之前；额外回合不重滚。</tspan></text></g><g class="node" data-key="turn-start-current-3" data-diff="false" tabindex="0" role="button" aria-label="普通玩家入口准备招式，查看说明和源码"><title>普通玩家入口准备招式: BeforePlayerSideTurnStart完成后、清格挡前选择首招或后继；已准备招式不重复解析。</title><rect x="778" y="620" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="635" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="649" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">普通玩家入口准备招式</tspan></text><text x="800" y="678" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">BeforePlayerSideTurnStart完成后、清格挡前选择首招或后继；已准</tspan><tspan x="800" dy="25.16">备招式不重复解析。</tspan></text></g><path d="M355,762 V785" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-start)" /><path d="M1085,762 V785" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-start)" /><circle cx="720" cy="838" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="843" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">5</tspan></text><g class="node" data-key="turn-start-source-4" data-diff="false" tabindex="0" role="button" aria-label="清格挡 → AfterBlockCleared，查看说明和源码"><title>清格挡 → AfterBlockCleared: 首个玩家回合例外；保留格挡有独立ShouldClearBlock与preventer回调。</title><rect x="48" y="790" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="805" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="819" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">清格挡 → AfterBlockCleared</tspan></text><text x="70" y="848" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">首个玩家回合例外；保留格挡有独立ShouldClearBlock与preventer回调。</tspan></text></g><g class="node" data-key="turn-start-current-4" data-diff="false" tabindex="0" role="button" aria-label="条件清格挡 → AfterBlockCleared，查看说明和源码"><title>条件清格挡 → AfterBlockCleared: 玩家首回合保留，其他回合foldEvent征询；仍发布清格挡后通知。</title><rect x="778" y="790" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="805" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="819" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">条件清格挡 → AfterBlockCleared</tspan></text><text x="800" y="848" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">玩家首回合保留，其他回合foldEvent征询；仍发布清格挡后通知。</tspan></text></g><path d="M355,932 V955" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-start)" /><path d="M1085,932 V955" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-start)" /><circle cx="720" cy="1008" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="1013" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">6</tspan></text><g class="node" data-key="turn-start-source-5" data-diff="false" tabindex="0" role="button" aria-label="能量 → 回合号 → 起手抽牌，查看说明和源码"><title>能量 → 回合号 → 起手抽牌: AfterEnergyReset后递增TurnNumber；BeforeHandDraw与ModifyHandDraw后抽牌。</title><rect x="48" y="960" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="975" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="989" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">能量 → 回合号 → 起手抽牌</tspan></text><text x="70" y="1018" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">AfterEnergyReset后递增TurnNumber；BeforeHandDraw与</tspan><tspan x="70" dy="25.16">ModifyHandDraw后抽牌。</tspan></text></g><g class="node" data-key="turn-start-current-5" data-diff="false" tabindex="0" role="button" aria-label="重置能量 → 增加回合号，查看说明和源码"><title>重置能量 → 增加回合号: ResetTurnEnergy后发AfterEnergyReset；随后增加TurnNumber，再BeforeHandDraw与真实起手抽牌。</title><rect x="778" y="960" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="975" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="989" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">重置能量 → 增加回合号</tspan></text><text x="800" y="1018" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">ResetTurnEnergy后发AfterEnergyReset；随后增加TurnNumber，再Befor</tspan><tspan x="800" dy="25.16">eHandDraw与真实起手抽牌。</tspan></text></g><path d="M355,1102 V1125" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-start)" /><path d="M1085,1102 V1125" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-start)" /><circle cx="720" cy="1178" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="1183" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">7</tspan></text><g class="node" data-key="turn-start-source-6" data-diff="false" tabindex="0" role="button" aria-label="AfterPlayer → AfterSide → 可操作，查看说明和源码"><title>AfterPlayer → AfterSide → 可操作: AfterPlayerTurnStart内部含Early／普通／Late；随后AfterSide、充能球和AutoPrePlay。</title><rect x="48" y="1130" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="1145" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="1159" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">AfterPlayer → AfterSide → 可操作</tspan></text><text x="70" y="1188" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">AfterPlayerTurnStart内部含Early／普通／Late；随后AfterSide、充</tspan><tspan x="70" dy="25.16">能球和AutoPrePlay。</tspan></text></g><g class="node" data-key="turn-start-current-6" data-diff="false" tabindex="0" role="button" aria-label="Early → 普通 → Late → Side，查看说明和源码"><title>Early → 普通 → Late → Side: 起手后依次发三个AfterPlayerTurnStart阶段，最后AfterPlayerSideTurnStart；额外回合未认证。</title><rect x="778" y="1130" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="1145" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="1159" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">Early → 普通 → Late → Side</tspan></text><text x="800" y="1188" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">起手后依次发三个AfterPlayerTurnStart阶段，最后AfterPlayerSideTur</tspan><tspan x="800" dy="25.16">nStart；额外回合未认证。</tspan></text></g><path d="M48,1359 H1392" stroke="#e2e8f0" /><text x="48" y="1387" font-size="17" font-weight="400" fill="#56667b"><tspan x="48" dy="0">Sai、HappyFlower等在起手与玩家开始三阶段之后响应AfterPlayerSideTurnStart；额外回合另行验证。</tspan></text></svg>
