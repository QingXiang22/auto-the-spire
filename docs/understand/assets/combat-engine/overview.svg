<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1088" role="img" aria-labelledby="title-overview desc-overview" style="font-family:Inter,Segoe UI,Microsoft YaHei,system-ui,sans-serif"><title id="title-overview">同一游戏规则，两种承载方式</title><desc id="desc-overview">参考把战斗领域直接写在C#引擎与模型里；base把领域流程写在DSL，交给通用Session执行。箭头表示主要调用／状态访问关系，不是全部时序。</desc><defs><marker id="arrow-overview" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#94a3b8" stroke-width="1.4" /></marker></defs><rect width="1440" height="1088" rx="22" fill="#ffffff" /><rect x="24" y="88" width="662" height="908" rx="18" fill="#f6f9ff" /><rect x="754" y="88" width="662" height="908" rx="18" fill="#f1fbf7" /><text x="48" y="40" font-size="16" font-weight="700" fill="#1d4ed8"><tspan x="48" dy="0">STS2-SIM</tspan></text><text x="48" y="67" font-size="22" font-weight="650" fill="#172c46"><tspan x="48" dy="0">C#领域引擎 · 锁定参考</tspan></text><text x="778" y="40" font-size="16" font-weight="700" fill="#087f68"><tspan x="778" dy="0">BASE-SPIRE</tspan></text><text x="778" y="67" font-size="22" font-weight="650" fill="#172c46"><tspan x="778" dy="0">DSL领域规则 · 当前实现</tspan></text><circle cx="720" cy="158" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="163" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">1</tspan></text><g class="node" data-key="overview-source-0" data-diff="false" tabindex="0" role="button" aria-label="RunDriver → CombatRoom，查看说明和源码"><title>RunDriver → CombatRoom: 正常访问准备编队，创建敌人并抽HP，再按槽位排列。</title><rect x="48" y="110" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="125" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="139" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">RunDriver → CombatRoom</tspan></text><text x="70" y="168" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">正常访问准备编队，创建敌人并抽HP，再按槽位排列。</tspan></text></g><g class="node" data-key="overview-current-0" data-diff="false" tabindex="0" role="button" aria-label="Host → Session.Submit，查看说明和源码"><title>Host → Session.Submit: 公开合法动作进入同一Session；正常Run与开发入口消费同一规则包。</title><rect x="778" y="110" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="125" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="139" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">Host → Session.Submit</tspan></text><text x="800" y="168" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">公开合法动作进入同一Session；正常Run与开发入口消费同一规则包。</tspan></text></g><path d="M355,252 V275" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-overview)" /><path d="M1085,252 V275" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-overview)" /><circle cx="720" cy="328" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="333" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">2</tspan></text><g class="node" data-key="overview-source-1" data-diff="false" tabindex="0" role="button" aria-label="CombatEngine，查看说明和源码"><title>CombatEngine: 管理开场、双方回合、阶段与胜负检查；调用Commands和Hook。</title><rect x="48" y="280" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="295" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="309" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">CombatEngine</tspan></text><text x="70" y="338" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">管理开场、双方回合、阶段与胜负检查；调用Commands和Hook。</tspan></text></g><g class="node" data-key="overview-current-1" data-diff="false" tabindex="0" role="button" aria-label="DSL战斗与Run过程，查看说明和源码"><title>DSL战斗与Run过程: lifecycle／enemy-turn／normal编排游戏阶段；这里拥有玩法语义。</title><rect x="778" y="280" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="295" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="309" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">DSL战斗与Run过程</tspan></text><text x="800" y="338" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">lifecycle／enemy-turn／normal编排游戏阶段；这里拥有玩法语义。</tspan></text></g><path d="M355,422 V445" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-overview)" /><path d="M1085,422 V445" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-overview)" /><circle cx="720" cy="498" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="503" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">3</tspan></text><g class="node" data-key="overview-source-2" data-diff="false" tabindex="0" role="button" aria-label="Commands / AttackCommand，查看说明和源码"><title>Commands / AttackCommand: 出牌、牌区、攻击、伤害、Power和遗物各有完整命令。</title><rect x="48" y="450" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="465" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="479" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">Commands / AttackCommand</tspan></text><text x="70" y="508" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">出牌、牌区、攻击、伤害、Power和遗物各有完整命令。</tspan></text></g><g class="node" data-key="overview-current-2" data-diff="false" tabindex="0" role="button" aria-label="领域共享过程，查看说明和源码"><title>领域共享过程: ExecuteAttack、牌区操作、ApplyPowerWithSource、ObtainRelic等。</title><rect x="778" y="450" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="465" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="479" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">领域共享过程</tspan></text><text x="800" y="508" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">ExecuteAttack、牌区操作、ApplyPowerWithSource、ObtainRelic等。</tspan></text></g><path d="M355,592 V615" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-overview)" /><path d="M1085,592 V615" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-overview)" /><circle cx="720" cy="668" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="673" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">4</tspan></text><g class="node" data-key="overview-source-3" data-diff="false" tabindex="0" role="button" aria-label="Hook → 模型覆盖方法，查看说明和源码"><title>Hook → 模型覆盖方法: 按具体dispatcher枚举监听者；通知产生效果，修正返回计算结果。</title><rect x="48" y="620" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="635" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="649" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">Hook → 模型覆盖方法</tspan></text><text x="70" y="678" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">按具体dispatcher枚举监听者；通知产生效果，修正返回计算结果。</tspan></text></g><g class="node" data-key="overview-current-3" data-diff="false" tabindex="0" role="button" aria-label="emit / foldEvent → 实例订阅，查看说明和源码"><title>emit / foldEvent → 实例订阅: instances筛选实例；priority与instance_order排序；pure限制修正副作用。</title><rect x="778" y="620" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="635" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="649" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">emit / foldEvent → 实例订阅</tspan></text><text x="800" y="678" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">instances筛选实例；priority与instance_order排序；pure限制修正</tspan><tspan x="800" dy="25.16">副作用。</tspan></text></g><path d="M355,762 V785" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-overview)" /><path d="M1085,762 V785" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-overview)" /><circle cx="720" cy="838" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="843" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">5</tspan></text><g class="node" data-key="overview-source-4" data-diff="false" tabindex="0" role="button" aria-label="RunState / CombatState / 模型，查看说明和源码"><title>RunState / CombatState / 模型: 长期库存归Run，战斗牌区与Creature归Combat；私有计数归模型实例。</title><rect x="48" y="790" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="805" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="819" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">RunState / CombatState / 模型</tspan></text><text x="70" y="848" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">长期库存归Run，战斗牌区与Creature归Combat；私有计数归模型实例。</tspan></text></g><g class="node" data-key="overview-current-4" data-diff="false" tabindex="0" role="button" aria-label="RuleSet / Session / State，查看说明和源码"><title>RuleSet / Session / State: 规则编译为IR；状态、执行帧、嵌套事件、决策续接与RNG由通用core保存。</title><rect x="778" y="790" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="805" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="819" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">RuleSet / Session / State</tspan></text><text x="800" y="848" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">规则编译为IR；状态、执行帧、嵌套事件、决策续接与RNG由通用core保存。</tspan></text></g><path d="M48,1019 H1392" stroke="#e2e8f0" /><text x="48" y="1047" font-size="17" font-weight="400" fill="#56667b"><tspan x="48" dy="0">可借鉴的是领域边界与调用语义。生产base不调用参考后端，也不需要复制一个C# CombatEngine。</tspan></text></svg>
