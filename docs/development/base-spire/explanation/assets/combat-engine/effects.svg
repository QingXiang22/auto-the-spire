<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1258" role="img" aria-labelledby="title-effects desc-effects" style="font-family:Inter,Segoe UI,Microsoft YaHei,system-ui,sans-serif"><title id="title-effects">复用完整边界，才能保留组合行为</title><desc id="desc-effects">两个系统都有“通知”和“修正”，但具体参与者、顺序与执行后回调仍需要逐个站点核对。</desc><defs><marker id="arrow-effects" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#94a3b8" stroke-width="1.4" /></marker></defs><rect width="1440" height="1258" rx="22" fill="#ffffff" /><rect x="24" y="88" width="662" height="1078" rx="18" fill="#f6f9ff" /><rect x="754" y="88" width="662" height="1078" rx="18" fill="#f1fbf7" /><text x="48" y="40" font-size="16" font-weight="700" fill="#1d4ed8"><tspan x="48" dy="0">STS2-SIM</tspan></text><text x="48" y="67" font-size="22" font-weight="650" fill="#172c46"><tspan x="48" dy="0">C#领域引擎 · 锁定参考</tspan></text><text x="778" y="40" font-size="16" font-weight="700" fill="#087f68"><tspan x="778" dy="0">BASE-SPIRE</tspan></text><text x="778" y="67" font-size="22" font-weight="650" fill="#172c46"><tspan x="778" dy="0">DSL领域规则 · 当前实现</tspan></text><circle cx="720" cy="158" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="163" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">1</tspan></text><g class="node" data-key="effects-source-0" data-diff="false" tabindex="0" role="button" aria-label="Run与Combat组合监听者，查看说明和源码"><title>Run与Combat组合监听者: 常用路径先遗物／药水，再盟友／敌人Power、模型、牌区等；具体dispatcher决定路径。</title><rect x="48" y="110" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="125" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="139" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">Run与Combat组合监听者</tspan></text><text x="70" y="168" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">常用路径先遗物／药水，再盟友／敌人Power、模型、牌区等；具体</tspan><tspan x="70" dy="25.16">dispatcher决定路径。</tspan></text></g><g class="node" data-key="effects-current-0" data-diff="false" tabindex="0" role="button" aria-label="事件定义与实例订阅，查看说明和源码"><title>事件定义与实例订阅: 入口保存候选及排序键，执行前重查instances资格；嵌套仍在同一Session栈。</title><rect x="778" y="110" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="125" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="139" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">事件定义与实例订阅</tspan></text><text x="800" y="168" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">入口保存候选及排序键，执行前重查instances资格；嵌套仍在同一</tspan><tspan x="800" dy="25.16">Session栈。</tspan></text></g><path d="M355,252 V275" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-effects)" /><path d="M1085,252 V275" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-effects)" /><circle cx="720" cy="328" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="333" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">2</tspan></text><g class="node" data-key="effects-source-1" data-diff="false" tabindex="0" role="button" aria-label="按dispatcher保留源顺序，查看说明和源码"><title>按dispatcher保留源顺序: ShouldClearBlock另走Power优先的含库存迭代；不能规定所有事件都遗物优先。</title><rect x="48" y="280" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="295" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="309" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">按dispatcher保留源顺序</tspan></text><text x="70" y="338" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">ShouldClearBlock另走Power优先的含库存迭代；不能规定所有事件都遗</tspan><tspan x="70" dy="25.16">物优先。</tspan></text></g><g class="node" data-key="effects-current-1" data-diff="false" tabindex="0" role="button" aria-label="按Run／Direct计算实例顺序，查看说明和源码"><title>按Run／Direct计算实例顺序: 常用广播先库存再玩家Power／牌与敌方；特定Direct路径Power先于库存。每事件显式选择。</title><rect x="778" y="280" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="295" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="309" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">按Run／Direct计算实例顺序</tspan></text><text x="800" y="338" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">常用广播先库存再玩家Power／牌与敌方；特定Direct路径Power先于库存</tspan><tspan x="800" dy="25.16">。每事件显式选择。</tspan></text></g><path d="M355,422 V445" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-effects)" /><path d="M1085,422 V445" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-effects)" /><circle cx="720" cy="498" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="503" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">3</tspan></text><g class="node" data-key="effects-source-2" data-diff="false" tabindex="0" role="button" aria-label="计算值＋实际修正者回调，查看说明和源码"><title>计算值＋实际修正者回调: 部分TryModify记录实际修正者，计算完成后再通知它们执行副作用。</title><rect x="48" y="450" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="465" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="479" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">计算值＋实际修正者回调</tspan></text><text x="70" y="508" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">部分TryModify记录实际修正者，计算完成后再通知它们执行副作用。</tspan></text></g><g class="node" data-key="effects-current-2" data-diff="false" tabindex="0" role="button" aria-label="纯计算 → 记录参与者 → After，查看说明和源码"><title>纯计算 → 记录参与者 → After: PowerAmountChange保存本次上下文，Received记录实际修正者，再由After通知执行Artifact消费。</title><rect x="778" y="450" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="465" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="479" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">纯计算 → 记录参与者 → After</tspan></text><text x="800" y="508" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">PowerAmountChange保存本次上下文，Received记录实际修正者，再由Aft</tspan><tspan x="800" dy="25.16">er通知执行Artifact消费。</tspan></text></g><path d="M355,592 V615" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-effects)" /><path d="M1085,592 V615" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-effects)" /><circle cx="720" cy="668" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="673" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">4</tspan></text><g class="node" data-key="effects-source-3" data-diff="false" tabindex="0" role="button" aria-label="一次AttackCommand，多次命中，查看说明和源码"><title>一次AttackCommand，多次命中: BeforeAttack → 修改击数 → 每击伤害与反应 → AfterAttack。</title><rect x="48" y="620" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="635" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="649" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">一次AttackCommand，多次命中</tspan></text><text x="70" y="678" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">BeforeAttack → 修改击数 → 每击伤害与反应 → AfterAttack。</tspan></text></g><g class="node" data-key="effects-current-3" data-diff="false" tabindex="0" role="button" aria-label="EnemyAttack一次Attack多Hit，查看说明和源码"><title>EnemyAttack一次Attack多Hit: 旧七敌人已迁移招式图；Tracker八击共用一次Attack，Vigor在完整攻击后消费。</title><rect x="778" y="620" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="635" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="649" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">EnemyAttack一次Attack多Hit</tspan></text><text x="800" y="678" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">旧七敌人已迁移招式图；Tracker八击共用一次Attack，Vigor在完整攻击</tspan><tspan x="800" dy="25.16">后消费。</tspan></text></g><path d="M355,762 V785" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-effects)" /><path d="M1085,762 V785" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-effects)" /><circle cx="720" cy="838" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="843" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">5</tspan></text><g class="node" data-key="effects-source-4" data-diff="false" tabindex="0" role="button" aria-label="修正 → 伤害／HP损失 → 结果，查看说明和源码"><title>修正 → 伤害／HP损失 → 结果: decimal加法／乘法／上限；再按ValueProp、重定向、死亡等完整命令处理。</title><rect x="48" y="790" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="805" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="819" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">修正 → 伤害／HP损失 → 结果</tspan></text><text x="70" y="848" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">decimal加法／乘法／上限；再按ValueProp、重定向、死亡等完整命令处</tspan><tspan x="70" dy="25.16">理。</tspan></text></g><g class="node" data-key="effects-current-4" data-diff="true" tabindex="0" role="button" aria-label="已迁移修正 → DamageResult批次，查看说明和源码"><title>已迁移修正 → DamageResult批次: 共享链保留Attack／Hit与死亡通知；敌方格挡、完整cap与死亡控制等仍有边界。</title><rect x="778" y="790" width="614" height="140" rx="13" fill="#fff9ed" stroke="#efc66b" stroke-width="1.4" /><rect x="778" y="805" width="4" height="110" rx="2" fill="#9c640c" /><text x="800" y="819" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">已迁移修正 → DamageResult批次</tspan></text><text x="800" y="848" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">共享链保留Attack／Hit与死亡通知；敌方格挡、完整cap与死亡控制等仍</tspan><tspan x="800" dy="25.16">有边界。</tspan></text><rect x="1311" y="907" width="62" height="17" rx="4" fill="#f9e6b6" /><text x="1321" y="902" font-size="12" font-weight="650" fill="#8a5b10"><tspan x="1321" dy="0">差异</tspan></text></g><path d="M355,932 V955" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-effects)" /><path d="M1085,932 V955" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-effects)" /><circle cx="720" cy="1008" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="1013" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">6</tspan></text><g class="node" data-key="effects-source-5" data-diff="false" tabindex="0" role="button" aria-label="IsEnding与IsInProgress分开，查看说明和源码"><title>IsEnding与IsInProgress分开: 命令各自检查结束中状态；例如末敌已死时Draw拒绝抽牌。</title><rect x="48" y="960" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="975" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="989" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">IsEnding与IsInProgress分开</tspan></text><text x="70" y="1018" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">命令各自检查结束中状态；例如末敌已死时Draw拒绝抽牌。</tspan></text></g><g class="node" data-key="effects-current-5" data-diff="false" tabindex="0" role="button" aria-label="命令ending门禁与外层收尾，查看说明和源码"><title>命令ending门禁与外层收尾: Draw、GainBlock、Exhaust与Power改量拒绝ending；保留已进入快照。Feed末杀仍增加上限并治疗。</title><rect x="778" y="960" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="975" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="989" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">命令ending门禁与外层收尾</tspan></text><text x="800" y="1018" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">Draw、GainBlock、Exhaust与Power改量拒绝ending；保留已进入快照。F</tspan><tspan x="800" dy="25.16">eed末杀仍增加上限并治疗。</tspan></text></g><path d="M48,1189 H1392" stroke="#e2e8f0" /><text x="48" y="1217" font-size="17" font-weight="400" fill="#56667b"><tspan x="48" dy="0">受控组件：CharonsAshes＋DarkEmbrace1耗尽击杀末敌，两侧均先伤害，后续抽牌被ending门禁拒绝。</tspan></text></svg>
