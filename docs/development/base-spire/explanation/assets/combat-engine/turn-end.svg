<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1428" role="img" aria-labelledby="title-turn-end desc-turn-end" style="font-family:Inter,Segoe UI,Microsoft YaHei,system-ui,sans-serif"><title id="title-turn-end">独立阶段不能只靠优先级替代</title><desc id="desc-turn-end">回合末“判断资格”和“兑现效果”可能处于不同站点。把它们合并，单个内容测试通过也可能掩盖组合错误。</desc><defs><marker id="arrow-turn-end" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#94a3b8" stroke-width="1.4"/></marker></defs><rect width="1440" height="1428" rx="22" fill="#ffffff"/><rect x="24" y="88" width="662" height="1248" rx="18" fill="#f6f9ff"/><rect x="754" y="88" width="662" height="1248" rx="18" fill="#f1fbf7"/><text x="48" y="40" font-size="16" font-weight="700" fill="#1d4ed8"><tspan x="48" dy="0">STS2-SIM</tspan></text><text x="48" y="67" font-size="22" font-weight="650" fill="#172c46"><tspan x="48" dy="0">C#领域引擎 · 锁定参考</tspan></text><text x="778" y="40" font-size="16" font-weight="700" fill="#087f68"><tspan x="778" dy="0">BASE-SPIRE</tspan></text><text x="778" y="67" font-size="22" font-weight="650" fill="#172c46"><tspan x="778" dy="0">DSL领域规则 · 当前实现</tspan></text><circle cx="720" cy="158" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="163" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">1</tspan></text><g class="node" data-key="turn-end-source-0" data-diff="false" tabindex="0" role="button" aria-label="AutoPostPlay → End，查看说明和源码"><title>AutoPostPlay → End: 先完成AfterAutoPostPlayPhaseEntered；再进入结束阶段并检查胜负。</title><rect x="48" y="110" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="125" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="139" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">AutoPostPlay → End</tspan></text><text x="70" y="168" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">先完成AfterAutoPostPlayPhaseEntered；再进入结束阶段并检查胜负。</tspan></text></g><g class="node" data-key="turn-end-current-0" data-diff="true" tabindex="0" role="button" aria-label="EndDevelopmentTurn，查看说明和源码"><title>EndDevelopmentTurn: 进入EffectDepth；依次BeforeTurnEndEffects、BeforePlayerTurnEnd与手牌收尾。</title><rect x="778" y="110" width="614" height="140" rx="13" fill="#fff9ed" stroke="#efc66b" stroke-width="1.4"/><rect x="778" y="125" width="4" height="110" rx="2" fill="#9c640c"/><text x="800" y="139" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">EndDevelopmentTurn</tspan></text><text x="800" y="168" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">进入EffectDepth；依次BeforeTurnEndEffects、</tspan><tspan x="800" dy="25.16">BeforePlayerTurnEnd与手牌收尾。</tspan></text><rect x="1311" y="227" width="62" height="17" rx="4" fill="#f9e6b6"/><text x="1321" y="222" font-size="12" font-weight="650" fill="#8a5b10"><tspan x="1321" dy="0">差异</tspan></text></g><path d="M355,252 V275" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-end)"/><path d="M1085,252 V275" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-end)"/><circle cx="720" cy="328" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="333" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">2</tspan></text><g class="node" data-key="turn-end-source-1" data-diff="false" tabindex="0" role="button" aria-label="VeryEarly → Early → 普通，查看说明和源码"><title>VeryEarly → Early → 普通: Orichalcum在Early记录零格挡；Plating也在Early给格挡；普通阶段再兑现Orichalcum。</title><rect x="48" y="280" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="295" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="309" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">VeryEarly → Early → 普通</tspan></text><text x="70" y="338" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">Orichalcum在Early记录零格挡；Plating也在Early给格挡；普通阶段再</tspan><tspan x="70" dy="25.16">兑现Orichalcum。</tspan></text></g><g class="node" data-key="turn-end-current-1" data-diff="true" tabindex="0" role="button" aria-label="缺少对应的早期资格快照，查看说明和源码"><title>缺少对应的早期资格快照: Plating先在BeforeTurnEndEffects给格挡；Orichalcum稍后在AfterTurnEnded即时检查。</title><rect x="778" y="280" width="614" height="140" rx="13" fill="#fff9ed" stroke="#efc66b" stroke-width="1.4"/><rect x="778" y="295" width="4" height="110" rx="2" fill="#9c640c"/><text x="800" y="309" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">缺少对应的早期资格快照</tspan></text><text x="800" y="338" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">Plating先在BeforeTurnEndEffects给格挡；Orichalcum稍后在</tspan><tspan x="800" dy="25.16">AfterTurnEnded即时检查。</tspan></text><rect x="1311" y="397" width="62" height="17" rx="4" fill="#f9e6b6"/><text x="1321" y="392" font-size="12" font-weight="650" fill="#8a5b10"><tspan x="1321" dy="0">差异</tspan></text></g><path d="M355,422 V445" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-end)"/><path d="M1085,422 V445" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-end)"/><circle cx="720" cy="498" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="503" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">3</tspan></text><g class="node" data-key="turn-end-source-2" data-diff="false" tabindex="0" role="button" aria-label="充能球 → 虚无／手牌末效果，查看说明和源码"><title>充能球 → 虚无／手牌末效果: 耗尽携带causedByEthereal；DarkEmbrace此时只记录次数，普通耗尽仍即时抽牌。</title><rect x="48" y="450" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="465" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="479" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">充能球 → 虚无／手牌末效果</tspan></text><text x="70" y="508" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">耗尽携带causedByEthereal；DarkEmbrace此时只记录次数，普通耗尽仍</tspan><tspan x="70" dy="25.16">即时抽牌。</tspan></text></g><g class="node" data-key="turn-end-current-2" data-diff="true" tabindex="0" role="button" aria-label="FinishTurnHand → 耗尽通知，查看说明和源码"><title>FinishTurnHand → 耗尽通知: CardExhausted只有owner／card，DarkEmbrace统一即时抽牌，原因与延迟状态缺失。</title><rect x="778" y="450" width="614" height="140" rx="13" fill="#fff9ed" stroke="#efc66b" stroke-width="1.4"/><rect x="778" y="465" width="4" height="110" rx="2" fill="#9c640c"/><text x="800" y="479" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">FinishTurnHand → 耗尽通知</tspan></text><text x="800" y="508" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">CardExhausted只有owner／card，DarkEmbrace统一即时抽牌，原因与</tspan><tspan x="800" dy="25.16">延迟状态缺失。</tspan></text><rect x="1311" y="567" width="62" height="17" rx="4" fill="#f9e6b6"/><text x="1321" y="562" font-size="12" font-weight="650" fill="#8a5b10"><tspan x="1321" dy="0">差异</tspan></text></g><path d="M355,592 V615" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-end)"/><path d="M1085,592 V615" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-end)"/><circle cx="720" cy="668" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="673" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">4</tspan></text><g class="node" data-key="turn-end-source-3" data-diff="false" tabindex="0" role="button" aria-label="BeforeFlush → 弃牌 → AfterFlush，查看说明和源码"><title>BeforeFlush → 弃牌 → AfterFlush: 保留与弃牌分组；AfterSideTurnEnd兑现DarkEmbrace的虚无累计抽牌。</title><rect x="48" y="620" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="635" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="649" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">BeforeFlush → 弃牌 → AfterFlush</tspan></text><text x="70" y="678" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">保留与弃牌分组；AfterSideTurnEnd兑现DarkEmbrace的虚无累计抽牌。</tspan></text></g><g class="node" data-key="turn-end-current-3" data-diff="true" tabindex="0" role="button" aria-label="AfterTurnEnded → AfterPlayerSideEnd，查看说明和源码"><title>AfterTurnEnded → AfterPlayerSideEnd: 在手牌收尾后发布这两个站点，再调用RunEnemyTurn；没有等价的虚无延迟流程。</title><rect x="778" y="620" width="614" height="140" rx="13" fill="#fff9ed" stroke="#efc66b" stroke-width="1.4"/><rect x="778" y="635" width="4" height="110" rx="2" fill="#9c640c"/><text x="800" y="649" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">AfterTurnEnded → AfterPlayerSideEnd</tspan></text><text x="800" y="678" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">在手牌收尾后发布这两个站点，再调用RunEnemyTurn；没有等价的虚无延</tspan><tspan x="800" dy="25.16">迟流程。</tspan></text><rect x="1311" y="737" width="62" height="17" rx="4" fill="#f9e6b6"/><text x="1321" y="732" font-size="12" font-weight="650" fill="#8a5b10"><tspan x="1321" dy="0">差异</tspan></text></g><path d="M355,762 V785" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-end)"/><path d="M1085,762 V785" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-end)"/><circle cx="720" cy="838" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="843" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">5</tspan></text><g class="node" data-key="turn-end-source-4" data-diff="false" tabindex="0" role="button" aria-label="换边 → 完整StartTurn，查看说明和源码"><title>换边 → 完整StartTurn: 双方共用Before／清格挡／AfterBlockCleared／AfterSide；新生怪物有行动资格门禁。</title><rect x="48" y="790" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="805" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="819" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">换边 → 完整StartTurn</tspan></text><text x="70" y="848" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">双方共用Before／清格挡／AfterBlockCleared／AfterSide；新生怪物</tspan><tspan x="70" dy="25.16">有行动资格门禁。</tspan></text></g><g class="node" data-key="turn-end-current-4" data-diff="true" tabindex="0" role="button" aria-label="逐敌人清格挡 → EnemyTurnStarted，查看说明和源码"><title>逐敌人清格挡 → EnemyTurnStarted: 直接把该敌人Block置0，再发布单体行动通知；并非完整双方共用生命周期。</title><rect x="778" y="790" width="614" height="140" rx="13" fill="#fff9ed" stroke="#efc66b" stroke-width="1.4"/><rect x="778" y="805" width="4" height="110" rx="2" fill="#9c640c"/><text x="800" y="819" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">逐敌人清格挡 → EnemyTurnStarted</tspan></text><text x="800" y="848" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">直接把该敌人Block置0，再发布单体行动通知；并非完整双方共用生命周</tspan><tspan x="800" dy="25.16">期。</tspan></text><rect x="1311" y="907" width="62" height="17" rx="4" fill="#f9e6b6"/><text x="1321" y="902" font-size="12" font-weight="650" fill="#8a5b10"><tspan x="1321" dy="0">差异</tspan></text></g><path d="M355,932 V955" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-end)"/><path d="M1085,932 V955" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-end)"/><circle cx="720" cy="1008" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="1013" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">6</tspan></text><g class="node" data-key="turn-end-source-5" data-diff="false" tabindex="0" role="button" aria-label="已选招式 → 胜负检查 → 末阶段，查看说明和源码"><title>已选招式 → 胜负检查 → 末阶段: 逐怪执行保存的NextMove；敌方末也有VeryEarly／Early／普通／After。</title><rect x="48" y="960" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="975" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="989" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">已选招式 → 胜负检查 → 末阶段</tspan></text><text x="70" y="1018" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">逐怪执行保存的NextMove；敌方末也有VeryEarly／Early／普通／After。</tspan></text></g><g class="node" data-key="turn-end-current-5" data-diff="true" tabindex="0" role="button" aria-label="执行通知 → AfterEnemyTurnEnded，查看说明和源码"><title>执行通知 → AfterEnemyTurnEnded: 当前图消费者执行保存招式；该末站点承接debuff、计时和部分清理。</title><rect x="778" y="960" width="614" height="140" rx="13" fill="#fff9ed" stroke="#efc66b" stroke-width="1.4"/><rect x="778" y="975" width="4" height="110" rx="2" fill="#9c640c"/><text x="800" y="989" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">执行通知 → AfterEnemyTurnEnded</tspan></text><text x="800" y="1018" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">当前图消费者执行保存招式；该末站点承接debuff、计时和部分清理。</tspan></text><rect x="1311" y="1077" width="62" height="17" rx="4" fill="#f9e6b6"/><text x="1321" y="1072" font-size="12" font-weight="650" fill="#8a5b10"><tspan x="1321" dy="0">差异</tspan></text></g><path d="M355,1102 V1125" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-end)"/><path d="M1085,1102 V1125" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-turn-end)"/><circle cx="720" cy="1178" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="1183" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">7</tspan></text><g class="node" data-key="turn-end-source-6" data-diff="false" tabindex="0" role="button" aria-label="换回玩家 → Round++ → StartTurn，查看说明和源码"><title>换回玩家 → Round++ → StartTurn: 在下一次BeforeSideTurnStart之后准备后续招式；继续普通玩家回合。</title><rect x="48" y="1130" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="1145" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="1159" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">换回玩家 → Round++ → StartTurn</tspan></text><text x="70" y="1188" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">在下一次BeforeSideTurnStart之后准备后续招式；继续普通玩家回合。</tspan></text></g><g class="node" data-key="turn-end-current-6" data-diff="true" tabindex="0" role="button" aria-label="在此SelectNextEnemyMove，查看说明和源码"><title>在此SelectNextEnemyMove: 之后AfterPlayerTurnFinished、重置费用并关闭TurnOpen；下次开始由调用方进入。</title><rect x="778" y="1130" width="614" height="140" rx="13" fill="#fff9ed" stroke="#efc66b" stroke-width="1.4"/><rect x="778" y="1145" width="4" height="110" rx="2" fill="#9c640c"/><text x="800" y="1159" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">在此SelectNextEnemyMove</tspan></text><text x="800" y="1188" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">之后AfterPlayerTurnFinished、重置费用并关闭TurnOpen；下次开始</tspan><tspan x="800" dy="25.16">由调用方进入。</tspan></text><rect x="1311" y="1247" width="62" height="17" rx="4" fill="#f9e6b6"/><text x="1321" y="1242" font-size="12" font-weight="650" fill="#8a5b10"><tspan x="1321" dy="0">差异</tspan></text></g><path d="M48,1359 H1392" stroke="#e2e8f0"/><text x="48" y="1387" font-size="17" font-weight="400" fill="#56667b"><tspan x="48" dy="0">受控组件：Orichalcum＋Plating5、末阶段开始Block0，当前DSL得到5格挡，锁定参考得到11。该结果不认证正常Run。</tspan></text></svg>