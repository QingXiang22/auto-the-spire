<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1258" role="img" aria-labelledby="title-relic desc-relic" style="font-family:Inter,Segoe UI,Microsoft YaHei,system-ui,sans-serif"><title id="title-relic">库存、持续效果与来源袋各有自己的事实</title><desc id="desc-relic">遗物模板可以复用触发方式，获得、替换和熔化仍必须经过完整库存操作。</desc><defs><marker id="arrow-relic" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#94a3b8" stroke-width="1.4"/></marker></defs><rect width="1440" height="1258" rx="22" fill="#ffffff"/><rect x="24" y="88" width="662" height="1078" rx="18" fill="#f6f9ff"/><rect x="754" y="88" width="662" height="1078" rx="18" fill="#f1fbf7"/><text x="48" y="40" font-size="16" font-weight="700" fill="#1d4ed8"><tspan x="48" dy="0">STS2-SIM</tspan></text><text x="48" y="67" font-size="22" font-weight="650" fill="#172c46"><tspan x="48" dy="0">C#领域引擎 · 锁定参考</tspan></text><text x="778" y="40" font-size="16" font-weight="700" fill="#087f68"><tspan x="778" dy="0">BASE-SPIRE</tspan></text><text x="778" y="67" font-size="22" font-weight="650" fill="#172c46"><tspan x="778" dy="0">DSL领域规则 · 当前实现</tspan></text><circle cx="720" cy="158" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="163" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">1</tspan></text><g class="node" data-key="relic-source-0" data-diff="false" tabindex="0" role="button" aria-label="Obtain检查可堆叠实例，查看说明和源码"><title>Obtain检查可堆叠实例: 同类可堆叠遗物增加StackCount并返回；否则克隆、绑定Owner、加入库存。</title><rect x="48" y="110" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="125" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="139" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">Obtain检查可堆叠实例</tspan></text><text x="70" y="168" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">同类可堆叠遗物增加StackCount并返回；否则克隆、绑定Owner、加入库</tspan><tspan x="70" dy="25.16">存。</tspan></text></g><g class="node" data-key="relic-current-0" data-diff="true" tabindex="0" role="button" aria-label="ObtainRelic创建库存实例，查看说明和源码"><title>ObtainRelic创建库存实例: 按definition创建并加入Relics，随后RelicObtained；共享入口缺少定义验证与堆叠。</title><rect x="778" y="110" width="614" height="140" rx="13" fill="#fff9ed" stroke="#efc66b" stroke-width="1.4"/><rect x="778" y="125" width="4" height="110" rx="2" fill="#9c640c"/><text x="800" y="139" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">ObtainRelic创建库存实例</tspan></text><text x="800" y="168" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">按definition创建并加入Relics，随后RelicObtained；共享入口缺少定</tspan><tspan x="800" dy="25.16">义验证与堆叠。</tspan></text><rect x="1311" y="227" width="62" height="17" rx="4" fill="#f9e6b6"/><text x="1321" y="222" font-size="12" font-weight="650" fill="#8a5b10"><tspan x="1321" dy="0">差异</tspan></text></g><path d="M355,252 V275" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-relic)"/><path d="M1085,252 V275" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-relic)"/><circle cx="720" cy="328" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="333" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">2</tspan></text><g class="node" data-key="relic-source-1" data-diff="false" tabindex="0" role="button" aria-label="移出来源袋 → AfterObtained，查看说明和源码"><title>移出来源袋 → AfterObtained: 非堆叠遗物从玩家袋／共享袋移除；拾取效果在已入库实例上执行。</title><rect x="48" y="280" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="295" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="309" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">移出来源袋 → AfterObtained</tspan></text><text x="70" y="338" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">非堆叠遗物从玩家袋／共享袋移除；拾取效果在已入库实例上执行。</tspan></text></g><g class="node" data-key="relic-current-1" data-diff="true" tabindex="0" role="button" aria-label="实例订阅执行拾取效果，查看说明和源码"><title>实例订阅执行拾取效果: 已有拾取资源／升级等共享模板；来源袋和正常资格必须由所属领域继续接入。</title><rect x="778" y="280" width="614" height="140" rx="13" fill="#fff9ed" stroke="#efc66b" stroke-width="1.4"/><rect x="778" y="295" width="4" height="110" rx="2" fill="#9c640c"/><text x="800" y="309" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">实例订阅执行拾取效果</tspan></text><text x="800" y="338" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">已有拾取资源／升级等共享模板；来源袋和正常资格必须由所属领域继续接</tspan><tspan x="800" dy="25.16">入。</tspan></text><rect x="1311" y="397" width="62" height="17" rx="4" fill="#f9e6b6"/><text x="1321" y="392" font-size="12" font-weight="650" fill="#8a5b10"><tspan x="1321" dy="0">差异</tspan></text></g><path d="M355,422 V445" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-relic)"/><path d="M1085,422 V445" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-relic)"/><circle cx="720" cy="498" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="503" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">3</tspan></text><g class="node" data-key="relic-source-2" data-diff="false" tabindex="0" role="button" aria-label="原位置替换，保留前后顺序，查看说明和源码"><title>原位置替换，保留前后顺序: 移除旧实例 → AfterRemoved → 原index插入新实例 → 来源袋处理 → AfterObtained。</title><rect x="48" y="450" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="465" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="479" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">原位置替换，保留前后顺序</tspan></text><text x="70" y="508" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">移除旧实例 → AfterRemoved → 原index插入新实例 → 来源袋处理 → </tspan><tspan x="70" dy="25.16">AfterObtained。</tspan></text></g><g class="node" data-key="relic-current-2" data-diff="true" tabindex="0" role="button" aria-label="只有RemoveRelic，查看说明和源码"><title>只有RemoveRelic: 出库 → RelicRemoved → destroy；没有等价的完整Replace操作。</title><rect x="778" y="450" width="614" height="140" rx="13" fill="#fff9ed" stroke="#efc66b" stroke-width="1.4"/><rect x="778" y="465" width="4" height="110" rx="2" fill="#9c640c"/><text x="800" y="479" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">只有RemoveRelic</tspan></text><text x="800" y="508" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">出库 → RelicRemoved → destroy；没有等价的完整Replace操作。</tspan></text><rect x="1311" y="567" width="62" height="17" rx="4" fill="#f9e6b6"/><text x="1321" y="562" font-size="12" font-weight="650" fill="#8a5b10"><tspan x="1321" dy="0">差异</tspan></text></g><path d="M355,592 V615" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-relic)"/><path d="M1085,592 V615" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-relic)"/><circle cx="720" cy="668" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="673" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">4</tspan></text><g class="node" data-key="relic-source-3" data-diff="false" tabindex="0" role="button" aria-label="Melt保留库存，查看说明和源码"><title>Melt保留库存: 验证已持有／蜡／未熔化；标记IsMelted后调用AfterRemoved，终止持续效果。</title><rect x="48" y="620" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="635" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="649" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">Melt保留库存</tspan></text><text x="70" y="678" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">验证已持有／蜡／未熔化；标记IsMelted后调用AfterRemoved，终止持续</tspan><tspan x="70" dy="25.16">效果。</tspan></text></g><g class="node" data-key="relic-current-3" data-diff="true" tabindex="0" role="button" aria-label="有IsMelted和监听筛选，查看说明和源码"><title>有IsMelted和监听筛选: 过滤机制存在，但尚无完整熔化命令；仅写字段不证明私有状态已清理。</title><rect x="778" y="620" width="614" height="140" rx="13" fill="#fff9ed" stroke="#efc66b" stroke-width="1.4"/><rect x="778" y="635" width="4" height="110" rx="2" fill="#9c640c"/><text x="800" y="649" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">有IsMelted和监听筛选</tspan></text><text x="800" y="678" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">过滤机制存在，但尚无完整熔化命令；仅写字段不证明私有状态已清理。</tspan></text><rect x="1311" y="737" width="62" height="17" rx="4" fill="#f9e6b6"/><text x="1321" y="732" font-size="12" font-weight="650" fill="#8a5b10"><tspan x="1321" dy="0">差异</tspan></text></g><path d="M355,762 V785" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-relic)"/><path d="M1085,762 V785" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-relic)"/><circle cx="720" cy="838" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="843" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">5</tspan></text><g class="node" data-key="relic-source-4" data-diff="false" tabindex="0" role="button" aria-label="模型私有计数与回调，查看说明和源码"><title>模型私有计数与回调: 每回合／每战／跨战计数由具体遗物维护；IsUsedUp与商店等资格分开。</title><rect x="48" y="790" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="805" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="819" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">模型私有计数与回调</tspan></text><text x="70" y="848" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">每回合／每战／跨战计数由具体遗物维护；IsUsedUp与商店等资格分开。</tspan></text></g><g class="node" data-key="relic-current-4" data-diff="false" tabindex="0" role="button" aria-label="实例字段＋模块附属实体，查看说明和源码"><title>实例字段＋模块附属实体: Counter／UsedThisCombat及模块状态可复用；各自重置与移除不能由全局出牌数反推。</title><rect x="778" y="790" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4"/><rect x="778" y="805" width="4" height="110" rx="2" fill="#087f68"/><text x="800" y="819" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">实例字段＋模块附属实体</tspan></text><text x="800" y="848" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">Counter／UsedThisCombat及模块状态可复用；各自重置与移除不能由全</tspan><tspan x="800" dy="25.16">局出牌数反推。</tspan></text></g><path d="M355,932 V955" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-relic)"/><path d="M1085,932 V955" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-relic)"/><circle cx="720" cy="1008" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="1013" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">6</tspan></text><g class="node" data-key="relic-source-5" data-diff="false" tabindex="0" role="button" aria-label="同一Hook，不同内容正文，查看说明和源码"><title>同一Hook，不同内容正文: Before／After／Modify表达阶段；具体遗物选择资格与动作。</title><rect x="48" y="960" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="975" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="989" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">同一Hook，不同内容正文</tspan></text><text x="70" y="1018" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">Before／After／Modify表达阶段；具体遗物选择资格与动作。</tspan></text></g><g class="node" data-key="relic-current-5" data-diff="false" tabindex="0" role="button" aria-label="先完整操作，再薄模板，查看说明和源码"><title>先完整操作，再薄模板: 公共操作拥有不变量；少数同构模板配置参数；特殊正文保留普通DSL组合。</title><rect x="778" y="960" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4"/><rect x="778" y="975" width="4" height="110" rx="2" fill="#087f68"/><text x="800" y="989" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">先完整操作，再薄模板</tspan></text><text x="800" y="1018" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">公共操作拥有不变量；少数同构模板配置参数；特殊正文保留普通DSL组合。</tspan></text></g><path d="M48,1189 H1392" stroke="#e2e8f0"/><text x="48" y="1217" font-size="17" font-weight="400" fill="#56667b"><tspan x="48" dy="0">纯修正、持有实例与共享模板已是可用基础。后续改进重点是生命周期和组合语义，不能仅扩大定义数量。</tspan></text></svg>