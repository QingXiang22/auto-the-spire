Created，查看说明和源码"><title>新建有BeforePowerCreated: 已有实例与直接Modify缺少等价的统一变更前通知。</title><rect x="778" y="280" width="614" height="140" rx="13" fill="#fff9ed" stroke="#efc66b" stroke-width="1.4"/><rect x="778" y="295" width="4" height="110" rx="2" fill="#9c640c"/><text x="800" y="309" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">新建有BeforePowerCreated</tspan></text><text x="800" y="338" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">已有实例与直接Modify缺少等价的统一变更前通知。</tspan></text><rect x="1311" y="397" width="62" height="17" rx="4" fill="#f9e6b6"/><text x="1321" y="392" font-size="12" font-weight="650" fill="#8a5b10"><tspan x="1321" dy="0">差异</tspan></text></g><path d="M355,422 V445" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)"/><path d="M1085,422 V445" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)"/><circle cx="720" cy="498" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="503" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">3</tspan></text><g class="node" data-key="power-source-2" data-diff="false" tabindex="0" role="button" aria-label="Given → Received，查看说明和源码"><title>Given → Received: 按源折叠本次delta，并记录实际Received修正者；减益类型可依delta符号变化。</title><rect x="48" y="450" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="465" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="479" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">Given → Received</tspan></text><text x="70" y="508" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">按源折叠本次delta，并记录实际Received修正者；减益类型可依delta符</tspan><tspan x="70" dy="25.16">号变化。</tspan></text></g><g class="node" data-key="power-current-2" data-diff="true" tabindex="0" role="button" aria-label="Given → Received折叠已有，查看说明和源码"><title>Given → Received折叠已有: Apply会计算actual；直接Modify不走相同修正；没有完整修正者后回调。</title><rect x="778" y="450" width="614" height="140" rx="13" fill="#fff9ed" stroke="#efc66b" stroke-width="1.4"/><rect x="778" y="465" width="4" height="110" rx="2" fill="#9c640c"/><text x="800" y="479" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">Given → Received折叠已有</tspan></text><text x="800" y="508" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">Apply会计算actual；直接Modify不走相同修正；没有完整修正者后回调。</tspan></text><rect x="1311" y="567" width="62" height="17" rx="4" fill="#f9e6b6"/><text x="1321" y="562" font-size="12" font-weight="650" fill="#8a5b10"><tspan x="1321" dy="0">差异</tspan></text></g><path d="M355,592 V615" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)"/><path d="M1085,592 V615" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)"/><circle cx="720" cy="668" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="673" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">4</tspan></text><g class="node" data-key="power-source-3" data-diff="false" tabindex="0" role="button" aria-label="新建：BeforeApplied → 挂载，查看说明和源码"><title>新建：BeforeApplied → 挂载: 再记录来源与SkipNextDurationTick；已有实例走ModifyAmount提交新层数。</title><rect x="48" y="620" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="635" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="649" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">新建：BeforeApplied → 挂载</tspan></text><text x="70" y="678" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">再记录来源与SkipNextDurationTick；已有实例走ModifyAmount提交新</tspan><tspan x="70" dy="25.16">层数。</tspan></text></g><g class="node" data-key="power-current-3" data-diff="false" tabindex="0" role="button" aria-label="创建／合并 → 模块私有状态，查看说明和源码"><title>创建／合并 → 模块私有状态: PowerCreated建立模块状态；支持普通／独立／按applier实例与回合到期字段。</title><rect x="778" y="620" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4"/><rect x="778" y="635" width="4" height="110" rx="2" fill="#087f68"/><text x="800" y="649" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">创建／合并 → 模块私有状态</tspan></text><text x="800" y="678" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">PowerCreated建立模块状态；支持普通／独立／按applier实例与回合到</tspan><tspan x="800" dy="25.16">期字段。</tspan></text></g><path d="M355,762 V785" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)"/><path d="M1085,762 V785" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)"/><circle cx="720" cy="838" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="843" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">5</tspan></text><g class="node" data-key="power-source-4" data-diff="false" tabindex="0" role="button" aria-label="AfterModifying → AfterApplied等，查看说明和源码"><title>AfterModifying → AfterApplied等: 即使被改成0，也执行实际修正者的After通知；Artifact在这里扣一层。</title><rect x="48" y="790" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="805" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="819" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">AfterModifying → AfterApplied等</tspan></text><text x="70" y="848" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">即使被改成0，也执行实际修正者的After通知；Artifact在这里扣一层。</tspan></text></g><g class="node" data-key="power-current-4" data-diff="true" tabindex="0" role="button" aria-label="PowerApplied / AmountChanged，查看说明和源码"><title>PowerApplied / AmountChanged: 缺少实际修正者回调；Artifact尚未登记，不能在pure里直接扣层补偿。</title><rect x="778" y="790" width="614" height="140" rx="13" fill="#fff9ed" stroke="#efc66b" stroke-width="1.4"/><rect x="778" y="805" width="4" height="110" rx="2" fill="#9c640c"/><text x="800" y="819" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">PowerApplied / AmountChanged</tspan></text><text x="800" y="848" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">缺少实际修正者回调；Artifact尚未登记，不能在pure里直接扣层补偿。</tspan></text><rect x="1311" y="907" width="62" height="17" rx="4" fill="#f9e6b6"/><text x="1321" y="902" font-size="12" font-weight="650" fill="#8a5b10"><tspan x="1321" dy="0">差异</tspan></text></g><path d="M355,932 V955" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)"/><path d="M1085,932 V955" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)"/><circle cx="720" cy="1008" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="1013" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">6</tspan></text><g class="node" data-key="power-source-5" data-diff="false" tabindex="0" role="button" aria-label="ModifyAmount也走前后通知，查看说明和源码"><title>ModifyAmount也走前后通知: Given／Received、修正后通知、AmountChanged，再按层数决定移除。</title><rect x="48" y="960" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="975" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="989" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">ModifyAmount也走前后通知</tspan></text><text x="70" y="1018" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">Given／Received、修正后通知、AmountChanged，再按层数决定移除。</tspan></text></g><g class="node" data-key="power-current-5" data-diff="true" tabindex="0" role="button" aria-label="ModifyPowerAmountWithSource，查看说明和源码"><title>ModifyPowerAmountWithSource: 直接写Stacks → AmountChanged → 到零移除；需要补齐源阶段且避免叠加双重修正。</title><rect x="778" y="960" width="614" height="140" rx="13" fill="#fff9ed" stroke="#efc66b" stroke-width="1.4"/><rect x="778" y="975" width="4" height="110" rx="2" fill="#9c640c"/><text x="800" y="989" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">ModifyPowerAmountWithSource</tspan></text><text x="800" y="1018" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">直接写Stacks → AmountChanged → 到零移除；需要补齐源阶段且避免叠</tspan><tspan x="800" dy="25.16">加双重修正。</tspan></text><rect x="1311" y="1077" width="62" height="17" rx="4" fill="#f9e6b6"/><text x="1321" y="1072" font-size="12" font-weight="650" fill="#8a5b10"><tspan x="1321" dy="0">差异</tspan></text></g><path d="M48,1189 H1392" stroke="#e2e8f0"/><text x="48" y="1217" font-size="17" font-weight="400" fill="#56667b"><tspan x="48" dy="0">应补强现有Power领域操作，并保留每个内容的私有状态；无需新增按Power ID执行效果的core分支。</tspan></text></svg>