<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1258" role="img" aria-labelledby="title-power desc-power" style="font-family:Inter,Segoe UI,Microsoft YaHei,system-ui,sans-serif"><title id="title-power">施加、叠加与直接变更需要同一套阶段语义</title><desc id="desc-power">图按核心调用分组展示。修正函数保持只读；扣除Artifact等副作用属于计算完成后的通知。</desc><defs><marker id="arrow-power" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#94a3b8" stroke-width="1.4"/></marker></defs><rect width="1440" height="1258" rx="22" fill="#ffffff"/><rect x="24" y="88" width="662" height="1078" rx="18" fill="#f6f9ff"/><rect x="754" y="88" width="662" height="1078" rx="18" fill="#f1fbf7"/><text x="48" y="40" font-size="16" font-weight="700" fill="#1d4ed8"><tspan x="48" dy="0">STS2-SIM</tspan></text><text x="48" y="67" font-size="22" font-weight="650" fill="#172c46"><tspan x="48" dy="0">C#领域引擎 · 锁定参考</tspan></text><text x="778" y="40" font-size="16" font-weight="700" fill="#087f68"><tspan x="778" dy="0">BASE-SPIRE</tspan></text><text x="778" y="67" font-size="22" font-weight="650" fill="#172c46"><tspan x="778" dy="0">DSL领域规则 · 当前实现</tspan></text><circle cx="720" cy="158" r="15" fill="#e9edf3"/><text text-anchor="middle" x="720" y="163" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">1</tspan></text><g class="node" data-key="power-source-0" data-diff="false" tabindex="0" role="button" aria-label="Apply / Modify入口，查看说明和源码"><title>Apply / Modify入口: 检查战斗ending、目标仍附着、可命中等；依据实例模式查找既有Power。</title><rect x="48" y="110" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4"/><rect x="48" y="125" width="4" height="110" rx="2" fill="#1d4ed8"/><text x="70" y="139" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">Apply / Modify入口</tspan></text><text x="70" y="168" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">检查战斗ending、目标仍附着、可命中等；依据实例模式查找既有Power。</tspan></text></g><g class="node" data-ke