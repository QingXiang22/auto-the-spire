<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1258" role="img" aria-labelledby="title-power desc-power" style="font-family:Inter,Segoe UI,Microsoft YaHei,system-ui,sans-serif"><title id="title-power">施加、叠加与直接变更需要同一套阶段语义</title><desc id="desc-power">图按核心调用分组展示。修正函数保持只读；扣除Artifact等副作用属于计算完成后的通知。</desc><defs><marker id="arrow-power" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#94a3b8" stroke-width="1.4" /></marker></defs><rect width="1440" height="1258" rx="22" fill="#ffffff" /><rect x="24" y="88" width="662" height="1078" rx="18" fill="#f6f9ff" /><rect x="754" y="88" width="662" height="1078" rx="18" fill="#f1fbf7" /><text x="48" y="40" font-size="16" font-weight="700" fill="#1d4ed8"><tspan x="48" dy="0">STS2-SIM</tspan></text><text x="48" y="67" font-size="22" font-weight="650" fill="#172c46"><tspan x="48" dy="0">C#领域引擎 · 锁定参考</tspan></text><text x="778" y="40" font-size="16" font-weight="700" fill="#087f68"><tspan x="778" dy="0">BASE-SPIRE</tspan></text><text x="778" y="67" font-size="22" font-weight="650" fill="#172c46"><tspan x="778" dy="0">DSL领域规则 · 当前实现</tspan></text><circle cx="720" cy="158" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="163" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">1</tspan></text><g class="node" data-key="power-source-0" data-diff="false" tabindex="0" role="button" aria-label="Apply / Modify入口，查看说明和源码"><title>Apply / Modify入口: 检查战斗ending、目标仍附着、可命中等；依据实例模式查找既有Power。</title><rect x="48" y="110" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="125" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="139" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">Apply / Modify入口</tspan></text><text x="70" y="168" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">检查战斗ending、目标仍附着、可命中等；依据实例模式查找既有Power。</tspan></text></g><g class="node" data-key="power-current-0" data-diff="false" tabindex="0" role="button" aria-label="ApplyPowerWithSource，查看说明和源码"><title>ApplyPowerWithSource: 检查定义、目标和来源；ending在通知前返回，死亡／逃离敌人不能修改。Remove仍可执行。</title><rect x="778" y="110" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="125" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="139" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">ApplyPowerWithSource</tspan></text><text x="800" y="168" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">检查定义、目标和来源；ending在通知前返回，死亡／逃离敌人不能修改</tspan><tspan x="800" dy="25.16">。Remove仍可执行。</tspan></text></g><path d="M355,252 V275" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)" /><path d="M1085,252 V275" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)" /><circle cx="720" cy="328" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="333" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">2</tspan></text><g class="node" data-key="power-source-1" data-diff="false" tabindex="0" role="button" aria-label="BeforePowerAmountChanged，查看说明和源码"><title>BeforePowerAmountChanged: 新建和已有实例增减均进入变更前通知；明确本次target／applier／card。</title><rect x="48" y="280" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="295" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="309" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">BeforePowerAmountChanged</tspan></text><text x="70" y="338" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">新建和已有实例增减均进入变更前通知；明确本次target／applier／</tspan><tspan x="70" dy="25.16">card。</tspan></text></g><g class="node" data-key="power-current-1" data-diff="false" tabindex="0" role="button" aria-label="统一BeforePowerAmountChanged，查看说明和源码"><title>统一BeforePowerAmountChanged: 新建、叠加、直接Modify进入同一变更上下文；新建原始0量不通知，已有0量仍进入。</title><rect x="778" y="280" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="295" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="309" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">统一BeforePowerAmountChanged</tspan></text><text x="800" y="338" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">新建、叠加、直接Modify进入同一变更上下文；新建原始0量不通知，已</tspan><tspan x="800" dy="25.16">有0量仍进入。</tspan></text></g><path d="M355,422 V445" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)" /><path d="M1085,422 V445" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)" /><circle cx="720" cy="498" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="503" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">3</tspan></text><g class="node" data-key="power-source-2" data-diff="false" tabindex="0" role="button" aria-label="Given → Received，查看说明和源码"><title>Given → Received: 按源折叠本次delta，并记录实际Received修正者；减益类型可依delta符号变化。</title><rect x="48" y="450" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="465" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="479" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">Given → Received</tspan></text><text x="70" y="508" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">按源折叠本次delta，并记录实际Received修正者；减益类型可依delta符</tspan><tspan x="70" dy="25.16">号变化。</tspan></text></g><g class="node" data-key="power-current-2" data-diff="false" tabindex="0" role="button" aria-label="Given → Receiving → 参与记录，查看说明和源码"><title>Given → Receiving → 参与记录: Given加法／乘法只运行一次；Receiving调用pure判定并记录实际参与者，内容副作用放到After。</title><rect x="778" y="450" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="465" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="479" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">Given → Receiving → 参与记录</tspan></text><text x="800" y="508" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">Given加法／乘法只运行一次；Receiving调用pure判定并记录实际参与者</tspan><tspan x="800" dy="25.16">，内容副作用放到After。</tspan></text></g><path d="M355,592 V615" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)" /><path d="M1085,592 V615" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)" /><circle cx="720" cy="668" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="673" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">4</tspan></text><g class="node" data-key="power-source-3" data-diff="false" tabindex="0" role="button" aria-label="新建：BeforeApplied → 挂载，查看说明和源码"><title>新建：BeforeApplied → 挂载: 再记录来源与SkipNextDurationTick；已有实例走ModifyAmount提交新层数。</title><rect x="48" y="620" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="635" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="649" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">新建：BeforeApplied → 挂载</tspan></text><text x="70" y="678" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">再记录来源与SkipNextDurationTick；已有实例走ModifyAmount提交新</tspan><tspan x="70" dy="25.16">层数。</tspan></text></g><g class="node" data-key="power-current-3" data-diff="false" tabindex="0" role="button" aria-label="创建／合并 → 模块私有状态，查看说明和源码"><title>创建／合并 → 模块私有状态: PowerCreated建立模块状态；支持普通／独立／按applier实例与回合到期字段。</title><rect x="778" y="620" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="635" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="649" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">创建／合并 → 模块私有状态</tspan></text><text x="800" y="678" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">PowerCreated建立模块状态；支持普通／独立／按applier实例与回合到</tspan><tspan x="800" dy="25.16">期字段。</tspan></text></g><path d="M355,762 V785" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)" /><path d="M1085,762 V785" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)" /><circle cx="720" cy="838" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="843" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">5</tspan></text><g class="node" data-key="power-source-4" data-diff="false" tabindex="0" role="button" aria-label="AfterModifying → AfterApplied等，查看说明和源码"><title>AfterModifying → AfterApplied等: 即使被改成0，也执行实际修正者的After通知；Artifact在这里扣一层。</title><rect x="48" y="790" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="805" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="819" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">AfterModifying → AfterApplied等</tspan></text><text x="70" y="848" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">即使被改成0，也执行实际修正者的After通知；Artifact在这里扣一层。</tspan></text></g><g class="node" data-key="power-current-4" data-diff="false" tabindex="0" role="button" aria-label="AfterModifying → Applied／Changed，查看说明和源码"><title>AfterModifying → Applied／Changed: 先让实际修正者执行After；Artifact将debuff改0后扣层，即使无新Power也消费。</title><rect x="778" y="790" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="805" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="819" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">AfterModifying → Applied／Changed</tspan></text><text x="800" y="848" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">先让实际修正者执行After；Artifact将debuff改0后扣层，即使无新Powe</tspan><tspan x="800" dy="25.16">r也消费。</tspan></text></g><path d="M355,932 V955" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)" /><path d="M1085,932 V955" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-power)" /><circle cx="720" cy="1008" r="15" fill="#e9edf3" /><text text-anchor="middle" x="720" y="1013" font-size="13" font-weight="650" fill="#52627a"><tspan x="720" dy="0">6</tspan></text><g class="node" data-key="power-source-5" data-diff="false" tabindex="0" role="button" aria-label="ModifyAmount也走前后通知，查看说明和源码"><title>ModifyAmount也走前后通知: Given／Received、修正后通知、AmountChanged，再按层数决定移除。</title><rect x="48" y="960" width="614" height="140" rx="13" fill="#eff6ff" stroke="#bfd5f5" stroke-width="1.4" /><rect x="48" y="975" width="4" height="110" rx="2" fill="#1d4ed8" /><text x="70" y="989" font-size="21" font-weight="650" fill="#142b44"><tspan x="70" dy="0">ModifyAmount也走前后通知</tspan></text><text x="70" y="1018" font-size="17" font-weight="400" fill="#41566d"><tspan x="70" dy="0">Given／Received、修正后通知、AmountChanged，再按层数决定移除。</tspan></text></g><g class="node" data-key="power-current-5" data-diff="false" tabindex="0" role="button" aria-label="Modify与叠加共用一次流程，查看说明和源码"><title>Modify与叠加共用一次流程: 直接改量同样经前置、修正、提交和后置；最后按层数／AllowNegative移除，保留来源与实例。</title><rect x="778" y="960" width="614" height="140" rx="13" fill="#ecfdf5" stroke="#abdccb" stroke-width="1.4" /><rect x="778" y="975" width="4" height="110" rx="2" fill="#087f68" /><text x="800" y="989" font-size="21" font-weight="650" fill="#142b44"><tspan x="800" dy="0">Modify与叠加共用一次流程</tspan></text><text x="800" y="1018" font-size="17" font-weight="400" fill="#41566d"><tspan x="800" dy="0">直接改量同样经前置、修正、提交和后置；最后按层数／AllowNegative</tspan><tspan x="800" dy="25.16">移除，保留来源与实例。</tspan></text></g><path d="M48,1189 H1392" stroke="#e2e8f0" /><text x="48" y="1217" font-size="17" font-weight="400" fill="#56667b"><tspan x="48" dy="0">应补强现有Power领域操作，并保留每个内容的私有状态；无需新增按Power ID执行效果的core分支。</tspan></text></svg>
