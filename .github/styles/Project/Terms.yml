extends: substitution
message: "建议使用“%s”，替换“%s”；含义与适用范围见 docs/meta/glossary.md。"
level: error
nonword: true
ignorecase: false
swap:
  夹具: 测试数据、测试辅助代码或测试环境
  台账: 任务清单、来源列表或检查结果
  见证: 行为测试或执行结果
  分母: 必测用例总数或来源条目总数
  对拍: 差异测试或与参考实现比较
  收口: 完成迁移、统一接口或修复具体问题
  门槛: 测试通过条件或发布条件
  闭环: 写明起点和终点的端到端流程
  切片: 开发场景或可独立交付的改动
  冻结: 固定版本、版本基线或兼容性约定
  契约: 接口约定或行为要求
  证据: 源码依据、测试结果或 CI 链接
  身份: 包版本与摘要、配置 ID 或实例标识
  '(?:验收|覆盖|阶段|候选|成本|结果|对照)结算': 统计结果或完成验收
  '(?:公开可用|正常\s*Run)(?:分开|分别)结算': 分别报告验证结果
